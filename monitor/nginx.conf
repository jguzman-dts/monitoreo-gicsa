server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # El dashboard interno es la raiz: entras a localhost:8099 y ya estas ahi.
    index dashboard.html;

    # El monitor reescribe el HTML cada minuto. Sin esto el navegador
    # serviria una copia vieja y el dashboard mentiria.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Los archivos de datos no se exponen: contienen IPs y detalle de
    # infraestructura del cliente, y el historial completo pesa.
    location ~* \.(json|jsonl|py|sh|env)$ {
        deny all;
        return 404;
    }

    location = /publico {
        try_files /dashboard-publico.html =404;
    }
}
